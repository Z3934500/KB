name: corporate-kb-ci

on:
  push:
    paths:
      - "corporate-knowledge-base-poc/**"
  pull_request:
    paths:
      - "corporate-knowledge-base-poc/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corporate-knowledge-base-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m corp_kb.cli query --tier lightweight "What should MVP1 use?"
