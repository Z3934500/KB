[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-knowledge-base-poc"
version = "0.1.0"
description = "Three-tier corporate knowledge-base automation PoC"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
corp-kb = "corp_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
